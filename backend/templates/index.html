<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Add eval cases, run scorers, inspect faithfulness/relevance.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/cases"><label>Question</label><input name="question" required/>
<label>Context</label><textarea name="context" rows="5" required></textarea>
<label>Gold</label><textarea name="gold" rows="2"></textarea><button type="submit">Add case</button></form>
</section><section class="card"><h2>Cases</h2>
{% for c in cases %}<div>{{ c.question }}
<form method="post" action="/ui/run"><input type="hidden" name="case_id" value="{{ c.id }}"/><button type="submit">Run</button></form></div>{% endfor %}
<h3>Runs</h3>{% for r in runs %}<div class="sub">faith={{ r.faithfulness }} rel={{ r.relevance }}</div>{% endfor %}
</section></div></main></body></html>
